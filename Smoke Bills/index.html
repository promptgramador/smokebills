<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SmokeBills</title>
<style>
  html,body{height:100%;margin:0;background:#07110a;}
  canvas{display:block;width:100%;height:100%}
  body{font-family:monospace;color:#9ef09e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});

const TAU = Math.PI * 2;
const SCORE_KEY = 's&d_high';
const LETTER_SLOTS = 3;
const DIGIT_SLOTS = 3;
const NAME_SLOT_COUNT = LETTER_SLOTS + DIGIT_SLOTS;
const WAVE_MULTS = [1,2,3,5,8,13,21,34,55];

function rand(a,b){ return Math.random()*(b-a)+a; }
function choose(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function formatMoney(v){ return '$' + Math.max(0, Math.floor(v)).toLocaleString('en-US'); }
function getWaveMultiplier(w){ return WAVE_MULTS[Math.min(WAVE_MULTS.length - 1, Math.max(0, w - 1))]; }
function normalizeName(name){
  const raw = String(name || '').toUpperCase();
  let letters = raw.replace(/[^A-Z]/g, '').slice(0, LETTER_SLOTS);
  while(letters.length < LETTER_SLOTS) letters += 'A';
  let digits = raw.replace(/[^0-9]/g, '').slice(0, DIGIT_SLOTS);
  while(digits.length < DIGIT_SLOTS) digits = '0' + digits;
  return letters + digits;
}
function randomId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function sortScores(list){
  list.sort((a,b)=>{
    if(b.score !== a.score) return b.score - a.score;
    if((b.wave||0) !== (a.wave||0)) return (b.wave||0) - (a.wave||0);
    return (a.date||0) - (b.date||0);
  });
  return list.slice(0,10);
}
function loadScores(){
  let raw = [];
  try{
    localStorage.removeItem(SCORE_KEY);
    raw = [];
  }catch(e){ raw = []; }
  if(!Array.isArray(raw)) raw = [];
  return sortScores(raw.map((entry, i)=>({
    id: entry && entry.id ? String(entry.id) : 'legacy-' + i,
    name: entry && entry.name ? normalizeName(entry.name) : 'CPU000',
    score: Math.max(0, Number(entry && entry.score) || 0),
    wave: Math.max(0, Number(entry && entry.wave) || 0),
    date: Number(entry && entry.date) || Date.now()
  })));
}
function serializeScores(){
  localStorage.setItem(SCORE_KEY, JSON.stringify(highScores));
  best = highScores.length ? highScores[0].score : 0;
}

const imgShip = new Image();
imgShip.src = 'Imagenes/whisky_PNG79.png';
const imgBill = new Image();
imgBill.src = 'Imagenes/png-clipart-united-states-dollar-banknote-paper-united-states-one-hundred-dollar-bill-banknote-stack-desktop-wallpaper.png';
let billCrop = {sx:0, sy:0, sw:0, sh:0};
imgBill.onload = function(){
  try{ billCrop = {sx:0, sy:0, sw:imgBill.naturalWidth, sh:imgBill.naturalHeight}; }
  catch(e){ billCrop = {sx:0, sy:0, sw:0, sh:0}; }
};

let state = 'title';
let score = 0, best = 0, wave = 1, lives = 3;
let kills = 0;
let difficultyLevel = 0;
let difficultyMultiplier = 1;
let highScores = loadScores();
best = highScores.length ? highScores[0].score : 0;
let displayedScore = 0;
let waveFlawless = true;
let waveBonusAwarded = false;
let waveClearTimer = 0;
let waveClearDelay = 2000;
let pause = false;
let lastShot = 0;
let shootCooldown = 250;
let maxRings = 4;
let powerupsActive = { triple:0, fast:0 };
let soundToastText = '';
let soundToastTimer = 0;
let centerFlashText = '';
let centerFlashColor = '#ffd24d';
let centerFlashTimer = 0;
let currentSessionEntryId = null;
let rankingOpenedAt = 0;
let rankingAutoBackAt = 0;
let gameOverQualifies = false;
let gameOverTimer = 0;
let pendingFinalScore = null;
let nameEntry = { letters:['A','A','A'], digits:['0','0','1'], active:0 };

const PLAYER_LEN = 60, PLAYER_W = 12, SHIP_SCALE = 3;
let player = {
  x:W/2, y:H/2, a:-Math.PI/2, vx:0, vy:0, thrust:0, inv:0,
  lives:3, respawnTimer:0, canShoot:true, shootTimer:0, pieces:[]
};

let rings = [], bills = [], particles = [], pickups = [];

const BILL_TYPES = {
  large: {w:80,h:40,score:10,split:'medium',color:'#2D6A27',edge:'#1f4b1a'},
  medium:{w:50,h:25,score:25,split:'small',color:'#3e7f35',edge:'#2b5a28'},
  small: {w:30,h:15,score:50,split:null,color:'#85bb65',edge:'#5e9a4e'}
};

const keys = {};
addEventListener('keydown', onKeyDown);
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = 0; });

function onKeyDown(e){
  const key = e.key;
  const lower = key.toLowerCase();
  keys[lower] = 1;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Enter'].includes(key)) e.preventDefault();

  if(lower === 's'){
    toggleMusicMute();
    return;
  }

  if(state === 'nameentry'){
    handleNameEntryKey(e);
    return;
  }

  if(state === 'ranking'){
    if(key === ' ' || key === 'Enter') returnToTitle();
    return;
  }

  if(state === 'title'){
    if(key === ' '){ startGame(); return; }
    if(lower === 'r' || key === 'Tab'){ openRanking(false); return; }
    return;
  }

  if(state === 'gameover'){
    if(gameOverQualifies) return;
    if(key === ' ' || key === 'Enter') returnToTitle();
    return;
  }

  if(state !== 'playing') return;
  if(lower === 'p') pause = !pause;
  if(lower === 'r') startGame(true);
}

function handleNameEntryKey(e){
  const key = e.key;
  const lower = key.toLowerCase();
  const isLetterSlot = nameEntry.active < LETTER_SLOTS;
  const confirmSelected = nameEntry.active === NAME_SLOT_COUNT;

  if(key === 'ArrowLeft'){ nameEntry.active = Math.max(0, nameEntry.active - 1); return; }
  if(key === 'ArrowRight' || key === 'Enter'){
    if(confirmSelected){ submitNameEntry(); return; }
    nameEntry.active = Math.min(NAME_SLOT_COUNT, nameEntry.active + 1);
    return;
  }
  if(key === ' '){
    if(confirmSelected) submitNameEntry();
    else nameEntry.active = Math.min(NAME_SLOT_COUNT, nameEntry.active + 1);
    return;
  }
  if(key === 'ArrowUp' || key === 'ArrowDown'){
    const dir = key === 'ArrowUp' ? 1 : -1;
    if(confirmSelected) return;
    if(isLetterSlot){
      const code = nameEntry.letters[nameEntry.active].charCodeAt(0) - 65;
      nameEntry.letters[nameEntry.active] = String.fromCharCode(65 + (code + dir + 26) % 26);
    } else {
      const idx = nameEntry.active - LETTER_SLOTS;
      const val = Number(nameEntry.digits[idx]);
      nameEntry.digits[idx] = String((val + dir + 10) % 10);
    }
    return;
  }
  if(/^[a-z]$/i.test(key) && isLetterSlot){
    nameEntry.letters[nameEntry.active] = lower.toUpperCase();
    nameEntry.active = Math.min(NAME_SLOT_COUNT, nameEntry.active + 1);
    return;
  }
  if(/^[0-9]$/.test(key) && !isLetterSlot && !confirmSelected){
    const idx = nameEntry.active - LETTER_SLOTS;
    nameEntry.digits[idx] = key;
    nameEntry.active = Math.min(NAME_SLOT_COUNT, nameEntry.active + 1);
  }
}

function currentEntryName(){ return nameEntry.letters.join('') + nameEntry.digits.join(''); }
function returnToTitle(){ state='title'; pause=false; rankingAutoBackAt=0; rankingOpenedAt=0; gameOverTimer=0; gameOverQualifies=false; pendingFinalScore=null; }
function openRanking(autoBack){ state='ranking'; rankingOpenedAt=performance.now(); rankingAutoBackAt=autoBack ? performance.now()+3000 : 0; }
function beginNameEntry(){ state='nameentry'; nameEntry = { letters:['A','A','A'], digits:['0','0','1'], active:0 }; }
function qualifiesForHighScore(scoreValue){ return highScores.length < 10 || scoreValue >= highScores[highScores.length - 1].score; }
function submitNameEntry(){
  if(!pendingFinalScore) return;
  const entry = { id:randomId(), name:currentEntryName(), score:pendingFinalScore.score, wave:pendingFinalScore.wave, date:Date.now() };
  highScores = sortScores(highScores.concat(entry));
  serializeScores();
  currentSessionEntryId = entry.id;
  openRanking(true);
}
function showCenterFlash(text, color, duration){ centerFlashText = text; centerFlashColor = color || '#ffd24d'; centerFlashTimer = duration || 120; }
function addScore(points){ score += points; }
function getKillPoints(type){ return BILL_TYPES[type].score * getWaveMultiplier(wave); }
function getGoldPickupPoints(){ return 500 * getWaveMultiplier(wave); }
function wrap(o){
  if(o.x < -200) o.x = W + 200;
  if(o.x > W + 200) o.x = -200;
  if(o.y < -200) o.y = H + 200;
  if(o.y > H + 200) o.y = -200;
}

function spawnBill(type, x, y, speed, angle){
  const t = BILL_TYPES[type];
  const sizeFactor = type === 'large' ? 1 : type === 'medium' ? 1.2 : 1.6;
  bills.push({
    type, x, y, w:t.w, h:t.h,
    vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
    a:rand(0,TAU), ra:rand(-0.02,0.02), hp:1, reserved:false,
    swayPhase:rand(0,TAU), swayFreq:rand(1.0,2.5) * sizeFactor,
    swayAmp:type === 'large' ? 1.5 : (type === 'medium' ? 2.6 : 4.0)
  });
}

function spawnWave(n){
  const actualCount = Math.max(1, Math.round(n * difficultyMultiplier));
  for(let i=0;i<actualCount;i++){
    const side = Math.floor(rand(0,4));
    let x = 0, y = 0;
    if(side === 0){ x = rand(0,W); y = -60; }
    if(side === 1){ x = W + 60; y = rand(0,H); }
    if(side === 2){ x = rand(0,W); y = H + 60; }
    if(side === 3){ x = -60; y = rand(0,H); }
    const baseSpeed = rand(0.3 + wave*0.03, 0.6 + wave*0.08);
    const speed = baseSpeed * difficultyMultiplier;
    spawnBill('large', x, y, speed, rand(0,TAU));
  }
}

function startGame(restart){
  state = 'playing';
  score = 0;
  displayedScore = 0;
  wave = 1;
  lives = 3;
  kills = 0;
  difficultyLevel = 0;
  difficultyMultiplier = 1;
  waveFlawless = true;
  waveBonusAwarded = false;
  waveClearTimer = 0;
  pause = false;
  gameOverTimer = 0;
  gameOverQualifies = false;
  pendingFinalScore = null;
  currentSessionEntryId = restart ? currentSessionEntryId : null;
  centerFlashTimer = 0;
  soundToastTimer = 0;
  powerupsActive = { triple:0, fast:0 };
  rings = [];
  bills = [];
  particles = [];
  pickups = [];
  player.lives = 3;
  player.x = W/2;
  player.y = H/2;
  player.a = -Math.PI/2;
  player.vx = 0;
  player.vy = 0;
  player.thrust = 0;
  player.inv = 0;
  spawnWave(4);
  try{ setLevelMusic(1); }catch(e){}
}

function shootRing(){
  if(rings.length >= maxRings) return;
  const now = performance.now();
  if(now - lastShot < shootCooldown) return;
  lastShot = now;
  const sx = player.x + Math.cos(player.a) * (PLAYER_LEN/2);
  const sy = player.y + Math.sin(player.a) * (PLAYER_LEN/2);
  const speed = powerupsActive.fast > 0 ? 14 : 10;
  rings.push({x:sx, y:sy, vx:Math.cos(player.a)*speed + player.vx, vy:Math.sin(player.a)*speed + player.vy, age:0, life:800});
}

function drawSmoke(x,y,a,thrust){
  const t = performance.now()/400;
  for(let i=0;i<4;i++){
    const s = i/3;
    const ox = x + Math.cos(a)*(-PLAYER_LEN/2) + Math.sin(a)*(s*8 + thrust*6);
    const oy = y + Math.sin(a)*(-PLAYER_LEN/2) - Math.cos(a)*(s*8 + thrust*6);
    const r = 4 + s*6 + thrust*3 + Math.abs(Math.sin(t+i))*2;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(200,200,200,' + (0.1 + 0.3*(1-s)) + ')';
    ctx.arc(ox + Math.sin(t+i)*6*s, oy - s*12, r, 0, TAU);
    ctx.fill();
  }
}

function drawCig(x,y,a,hit){
  ctx.save();
  ctx.translate(x,y);
  const len = PLAYER_LEN;
  const wid = Math.max(PLAYER_W*1.6, 14);
  if(imgShip && imgShip.complete && imgShip.naturalWidth){
    let dw = len, dh = wid;
    try{
      const scale = Math.min(len / imgShip.naturalWidth, wid / imgShip.naturalHeight) * SHIP_SCALE;
      dw = imgShip.naturalWidth * scale;
      dh = imgShip.naturalHeight * scale;
      ctx.save();
      ctx.rotate(a + Math.PI/2);
      ctx.drawImage(imgShip, -dw/2, -dh/2, dw, dh);
      if(hit){
        ctx.strokeStyle = 'rgba(255,100,60,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-dw*0.15,-dh*0.2);
        ctx.lineTo(-dw*0.05,dh*0.05);
        ctx.lineTo(dw*0.05,-dh*0.05);
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore();
      return;
    }catch(e){}
  }

  ctx.rotate(a);
  ctx.fillStyle = 'rgba(220,230,235,0.06)';
  ctx.strokeStyle = 'rgba(200,210,200,0.25)';
  ctx.lineWidth = 2;
  roundRect(ctx, -len/2, -wid/2, len, wid, wid/2);
  ctx.fill();
  ctx.stroke();

  const level = 0.56;
  ctx.save();
  roundRect(ctx, -len/2 + 3, -wid/2 + 3 + (1-level)*(wid-6), len-6, (wid-6)*level, (wid-6)/4);
  ctx.fillStyle = 'rgba(183,108,36,0.95)';
  ctx.fill();
  ctx.restore();

  const neckW = Math.max(8, wid*0.45);
  ctx.fillStyle = '#4a2f1b';
  ctx.fillRect(len/2 - neckW, -wid*0.28, neckW, wid*0.56);
  ctx.fillStyle = '#c79b6a';
  ctx.fillRect(len/2 - neckW + 2, -wid*0.24, neckW - 4, wid*0.48);

  ctx.fillStyle = '#f7f0e2';
  const labelW = len * 0.5;
  ctx.save();
  roundRect(ctx, -labelW/2, -wid*0.25, labelW, wid*0.5, 4);
  ctx.clip();
  let labFont = Math.floor(wid*0.35);
  ctx.font = labFont + 'px monospace';
  while(ctx.measureText('OLD NO.7').width > labelW - 8 && labFont > 6){ labFont--; ctx.font = labFont + 'px monospace'; }
  ctx.textAlign = 'center';
  ctx.fillText('OLD NO.7', 0, labFont/3);
  ctx.restore();

  ctx.beginPath();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.ellipse(-len/6, -wid/6, len*0.18, wid*0.22, 0, 0, TAU);
  ctx.fill();

  if(hit){
    ctx.strokeStyle = 'rgba(255,100,60,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-len*0.15,-wid*0.2);
    ctx.lineTo(-len*0.05,wid*0.05);
    ctx.lineTo(len*0.05,-wid*0.05);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBill(b){
  const t = BILL_TYPES[b.type];
  const now = performance.now()/1000;
  const sway = Math.sin(now*b.swayFreq + b.swayPhase) * b.swayAmp;
  const velNorm = Math.hypot(b.vx,b.vy) || 1;
  const rx = (-b.vy / velNorm) * sway;
  const ry = (b.vx / velNorm) * sway;
  const flutter = Math.sin(now*(b.swayFreq*0.8) + b.swayPhase) * (0.08 * (b.swayAmp/2));

  ctx.save();
  ctx.translate(b.x + rx, b.y + ry);
  ctx.rotate(b.a + flutter);

  if(imgBill && imgBill.complete && imgBill.naturalWidth){
    try{
      if(billCrop.sw && billCrop.sh) ctx.drawImage(imgBill, billCrop.sx, billCrop.sy, billCrop.sw, billCrop.sh, -t.w/2, -t.h/2, t.w, t.h);
      else ctx.drawImage(imgBill, -t.w/2, -t.h/2, t.w, t.h);
      ctx.restore();
      return;
    }catch(e){}
  }

  ctx.fillStyle = t.color;
  ctx.strokeStyle = t.edge;
  ctx.lineWidth = 2;
  roundRect(ctx, -t.w/2, -t.h/2, t.w, t.h, 4);
  ctx.fill();
  ctx.stroke();

  const pad = 6;
  const innerW = t.w - pad*2;
  const innerH = t.h - pad*2;
  ctx.save();
  roundRect(ctx, -innerW/2, -innerH/2, innerW, innerH, 3);
  ctx.clip();

  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-t.w/2, -1, t.w, 2);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#eaf9ea';
  let bigFont = Math.floor(innerH*0.5);
  ctx.font = bigFont + 'px monospace';
  ctx.textAlign = 'left';
  while(ctx.measureText('100').width > innerW*0.35 && bigFont > 6){ bigFont--; ctx.font = bigFont + 'px monospace'; }
  ctx.fillText('100', -innerW/2 + 6, bigFont/2 - 2);
  ctx.textAlign = 'right';
  ctx.fillText('100', innerW/2 - 6, innerH/4 + bigFont/4);

  const portR = Math.min(innerH*0.28, innerW*0.18);
  ctx.beginPath();
  ctx.fillStyle = '#e7f6e7';
  ctx.arc(0,0,portR,0,TAU);
  ctx.fill();
  ctx.fillStyle = '#164';
  ctx.font = Math.max(8, Math.floor(portR*0.35)) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Franklin', 0, 4);

  let tinyFont = Math.floor(innerH*0.16);
  ctx.font = tinyFont + 'px monospace';
  while(ctx.measureText('THE UNITED STATES OF AMERICA').width > innerW - 8 && tinyFont > 6){ tinyFont--; ctx.font = tinyFont + 'px monospace'; }
  ctx.fillStyle = '#cfe8cf';
  ctx.fillText('THE UNITED STATES OF AMERICA', 0, -innerH/2 + tinyFont + 2);

  ctx.fillStyle = '#dfffdc';
  ctx.font = Math.max(7, Math.floor(innerH*0.14)) + 'px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(randomSerial(b.x+b.y), innerW/2 - 6, -innerH/2 + 12);

  ctx.restore();
  ctx.beginPath();
  ctx.fillStyle = '#1f7a3f';
  ctx.arc(t.w/2 - 12, 0, t.h*0.18, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function spawnConfetti(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),w:rand(4,10),h:rand(2,6),age:0,life:600,ra:rand(-0.2,0.2),col:choose(['#aee6a6','#74c774','#2D6A27','#85bb65'])});
  }
}

function spawnPopup(x,y,text,color){
  particles.push({x,y,vx:0,vy:-0.5,txt:text,age:0,life:1000,fade:1,txtCol:color});
}

function hitBill(index){
  const b = bills[index];
  const t = BILL_TYPES[b.type];
  const points = getKillPoints(b.type);
  addScore(points);
  kills++;
  updateDifficulty();
  if(t.split){
    const ang = Math.atan2(player.y - b.y, player.x - b.x);
    const a1 = ang + Math.PI + 0.5;
    const a2 = ang + Math.PI - 0.5;
    const speed = (Math.hypot(b.vx,b.vy) + 1.2) * difficultyMultiplier;
    spawnBill(t.split, b.x + Math.cos(a1)*10, b.y + Math.sin(a1)*10, speed, rand(0,TAU));
    spawnBill(t.split, b.x + Math.cos(a2)*10, b.y + Math.sin(a2)*10, speed, rand(0,TAU));
    if(Math.random() < 0.06) pickups.push({x:b.x,y:b.y,vx:rand(-0.4,0.4),vy:rand(-0.4,0.4),type:choose(['lighter','wind','gold']),age:0});
  }
  spawnConfetti(b.x,b.y,25);
  spawnPopup(b.x,b.y,'+' + points.toLocaleString('en-US'),'#ffd24d');
  bills.splice(index,1);
}

function explodeBill(x,y){
  spawnConfetti(x,y,30);
  spawnPopup(x,y,'BANG!','#fff');
}

function playerHit(){
  lives--;
  player.lives = lives;
  player.inv = 120;
  waveFlawless = false;
  for(let i=0;i<5;i++){
    particles.push({x:player.x,y:player.y,vx:rand(-3,3),vy:rand(-3,3),w:rand(8,20),h:rand(4,10),age:0,life:1000,ra:rand(-0.3,0.3),col:'#fff'});
  }
  player.x = W/2;
  player.y = H/2;
  player.vx = 0;
  player.vy = 0;
  player.a = -Math.PI/2;
  if(lives <= 0) gameOver();
}

function applyPickup(p){
  if(p.type === 'lighter') powerupsActive.triple = 8*60;
  if(p.type === 'wind') powerupsActive.fast = 8*60;
  if(p.type === 'gold'){
    const points = getGoldPickupPoints();
    addScore(points);
    spawnPopup(p.x,p.y,'+' + points.toLocaleString('en-US'),'#ffd700');
  }
}

function nextWave(){
  wave++;
  waveFlawless = true;
  waveBonusAwarded = false;
  spawnWave(4 + Math.floor(wave - 1));
  showCenterFlash('MULTIPLIER x' + getWaveMultiplier(wave) + '!', '#ffe87a', 120);
  try{ setLevelMusic(Math.min(4, Math.max(1, wave))); }catch(e){}
}

function updateDifficulty(){
  const newLevel = Math.floor(kills / 10);
  if(newLevel !== difficultyLevel){
    difficultyLevel = newLevel;
    difficultyMultiplier = Math.pow(1.01, difficultyLevel);
  }
}

function gameOver(){
  state = 'gameover';
  pause = false;
  pendingFinalScore = { score, wave };
  gameOverQualifies = qualifiesForHighScore(score);
  gameOverTimer = gameOverQualifies ? 120 : 0;
}

function updateGame(dt){
  if(pause || state !== 'playing') return;

  const rotSpeed = 0.08;
  if(keys['arrowleft'] || keys['a']) player.a -= rotSpeed*dt;
  if(keys['arrowright'] || keys['d']) player.a += rotSpeed*dt;
  if(keys['arrowup'] || keys['w']){
    player.vx += Math.cos(player.a)*0.2*dt;
    player.vy += Math.sin(player.a)*0.2*dt;
    player.thrust = 1;
  } else {
    player.thrust = 0;
  }

  const sp = Math.hypot(player.vx, player.vy);
  if(sp > 8){
    player.vx = player.vx / sp * 8;
    player.vy = player.vy / sp * 8;
  }

  player.vx *= 0.99;
  player.vy *= 0.99;
  player.x += player.vx*dt;
  player.y += player.vy*dt;
  wrap(player);

  if((keys[' '] || keys['space']) && performance.now() - lastShot > shootCooldown){
    if(powerupsActive.triple > 0){
      for(let k=-1;k<=1;k++){
        const ang = player.a + k*0.12;
        const sx = player.x + Math.cos(ang)*(PLAYER_LEN/2);
        const sy = player.y + Math.sin(ang)*(PLAYER_LEN/2);
        if(rings.length < maxRings + 2){
          rings.push({x:sx,y:sy,vx:Math.cos(ang)*(powerupsActive.fast?14:10)+player.vx,vy:Math.sin(ang)*(powerupsActive.fast?14:10)+player.vy,age:0,life:800});
        }
      }
      lastShot = performance.now();
    } else {
      shootRing();
    }
  }

  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.x += r.vx*dt;
    r.y += r.vy*dt;
    r.age += 16*dt;
    wrap(r);
    if(r.age > r.life) rings.splice(i,1);
  }

  for(let i=bills.length-1;i>=0;i--){
    const b = bills[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.a += b.ra*dt;
    wrap(b);
    for(let j=rings.length-1;j>=0;j--){
      const ring = rings[j];
      if(dist(ring.x,ring.y,b.x,b.y) < Math.max(b.w,b.h)/2){
        rings.splice(j,1);
        hitBill(i);
        break;
      }
    }
    if(player.inv <= 0 && dist(player.x,player.y,b.x,b.y) < Math.max(b.w,b.h)/2 + PLAYER_LEN/3){
      explodeBill(b.x,b.y);
      playerHit();
      bills.splice(i,1);
      continue;
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.age += 16*dt;
    p.a += p.ra*dt;
    if(p.age > p.life) particles.splice(i,1);
  }

  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.age += 16*dt;
    wrap(p);
    if(dist(p.x,p.y,player.x,player.y) < 20){
      applyPickup(p);
      pickups.splice(i,1);
      continue;
    }
    if(p.age > 10000) pickups.splice(i,1);
  }

  if(powerupsActive.triple > 0) powerupsActive.triple -= dt*16;
  if(powerupsActive.fast > 0) powerupsActive.fast -= dt*16;
  if(player.inv > 0) player.inv -= dt*16;

  const diff = score - displayedScore;
  if(Math.abs(diff) > 0.01) displayedScore += diff * Math.min(1, 0.12 * dt);
  else displayedScore = score;

  if(bills.length === 0){
    if(!waveBonusAwarded){
      waveBonusAwarded = true;
      if(waveFlawless){
        const bonus = 1000 * getWaveMultiplier(wave);
        addScore(bonus);
        showCenterFlash('WAVE BONUS! +' + formatMoney(bonus), '#ffd24d', 150);
      }
      waveClearTimer = performance.now();
    } else if(performance.now() - waveClearTimer > waveClearDelay){
      nextWave();
      waveClearTimer = 0;
    }
  }
}

function updateMeta(dt){
  if(soundToastTimer > 0) soundToastTimer -= dt*16;
  if(centerFlashTimer > 0) centerFlashTimer -= dt*16;

  if(state === 'gameover' && gameOverQualifies && gameOverTimer > 0){
    gameOverTimer -= dt*16;
    if(gameOverTimer <= 0) beginNameEntry();
  }

  if(state === 'ranking' && rankingAutoBackAt && performance.now() >= rankingAutoBackAt){
    returnToTitle();
  }
}

function drawRing(r){
  ctx.save();
  ctx.translate(r.x,r.y);
  ctx.fillStyle = 'rgba(230,230,230,0.9)';
  ctx.beginPath();
  ctx.arc(0,0,10,0,TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(0,0,5,0,TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function drawPickup(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.fillStyle = p.type === 'gold' ? '#ffd700' : (p.type === 'lighter' ? '#ff6a3d' : '#9fd6ff');
  ctx.beginPath();
  ctx.arc(0,0,10,0,TAU);
  ctx.fill();
  ctx.restore();
}

function drawMiniBill(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(b.a*0.1);
  const w = 48, h = 24;
  if(imgBill && imgBill.complete && imgBill.naturalWidth){
    try{
      if(billCrop.sw && billCrop.sh) ctx.drawImage(imgBill, billCrop.sx, billCrop.sy, billCrop.sw, billCrop.sh, -w/2, -h/2, w, h);
      else ctx.drawImage(imgBill, -w/2, -h/2, w, h);
      ctx.restore();
      return;
    }catch(e){}
  }
  ctx.fillStyle = '#2D6A27';
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.fillText('100', -14, 4);
  ctx.restore();
}

function drawScrollingBills(){
  for(let i=0;i<8;i++){
    const bx = (i*170 + performance.now()/8) % (W + 240) - 120;
    const by = 80 + (i%4)*110 + Math.sin(performance.now()/700 + i)*25;
    drawMiniBill({x:bx,y:by,a:performance.now()/1000 + i});
  }
}

function drawBackgroundBase(){
  ctx.fillStyle = '#05120b';
  ctx.fillRect(0,0,W,H);
  const tint = Math.min(0.18, difficultyLevel * 0.01);
  if(tint > 0){
    ctx.fillStyle = 'rgba(45,106,39,' + tint + ')';
    ctx.fillRect(0,0,W,H);
  }
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(15,45,10,0.06)');
  grad.addColorStop(1,'rgba(0,0,0,0.06)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawGameplayScene(){
  drawBackgroundBase();
  for(const b of bills) drawBill(b);
  for(const p of pickups) drawPickup(p);
  for(const r of rings) drawRing(r);
  const inv = player.inv > 0;
  if(!(inv && Math.floor(performance.now()/80)%2 === 0)){
    drawCig(player.x,player.y,player.a, player.inv > 0);
    drawSmoke(player.x,player.y,player.a, player.thrust);
  }
  for(const p of particles){
    if(p.txt){
      ctx.globalAlpha = 1 - p.age/p.life;
      ctx.fillStyle = p.txtCol || '#fff';
      ctx.font = '18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
    } else {
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.a || 0);
      ctx.fillStyle = p.col || '#fff';
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
  }
  drawHUD();
  drawSoundToast();
  drawCenterFlash();
}

function drawHUD(){
  const mult = getWaveMultiplier(wave);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9ff29f';
  ctx.font = '20px monospace';
  ctx.fillText(formatMoney(displayedScore), 20, 30);
  ctx.textAlign = 'center';
  ctx.fillText('BEST: ' + formatMoney(best), W/2, 30);

  const waveText = 'WAVE ' + wave;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#9ff29f';
  ctx.fillText(waveText, W - 110, 30);

  ctx.save();
  ctx.font = '16px monospace';
  const badge = 'x' + mult;
  const tw = ctx.measureText(badge).width;
  const bx = W - 95;
  const by = 12;
  const bw = tw + 18;
  const bh = 24;
  ctx.fillStyle = 'rgba(255,215,84,0.22)';
  roundRect(ctx, bx, by, bw, bh, 6);
  ctx.fill();
  ctx.strokeStyle = '#ffd24d';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffe27a';
  ctx.textAlign = 'left';
  ctx.fillText(badge, bx + 9, by + 17);
  ctx.restore();

  for(let i=0;i<player.lives;i++) drawCig(30 + i*40, H-30, -Math.PI/2, false);
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.strokeStyle = i < rings.length ? '#fff' : 'rgba(200,200,200,0.3)';
    ctx.lineWidth = 2;
    ctx.arc(W - 40 - i*20, H - 30, 8, 0, TAU);
    ctx.stroke();
  }
}

function drawSoundToast(){
  if(soundToastTimer <= 0 || !soundToastText) return;
  const alpha = Math.min(1, soundToastTimer / 180);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.font = '18px monospace';
  const textW = ctx.measureText(soundToastText).width;
  const boxW = textW + 36;
  const boxH = 40;
  const x = W/2 - boxW/2;
  const y = H - 70;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  roundRect(ctx, x, y, boxW, boxH, 10);
  ctx.fill();
  ctx.strokeStyle = '#9ff29f';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#d7ffd7';
  ctx.fillText(soundToastText, W/2, y + boxH/2 + 6);
  ctx.restore();
}

function drawCenterFlash(){
  if(centerFlashTimer <= 0 || !centerFlashText) return;
  const alpha = Math.min(1, centerFlashTimer / 35);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px monospace';
  ctx.shadowBlur = 18;
  ctx.shadowColor = centerFlashColor;
  ctx.fillStyle = centerFlashColor;
  ctx.fillText(centerFlashText, W/2, H*0.24);
  ctx.restore();
}

function drawTitleScreen(){
  drawBackgroundBase();
  drawScrollingBills();
  const cx = W/2 + Math.sin(performance.now()/500)*80;
  const cy = H/2;
  drawCig(cx,cy,-Math.PI/2,false);
  drawSmoke(cx,cy,-Math.PI/2,0.5);

  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#3b8a3b';
  ctx.fillStyle = '#cdeccf';
  ctx.font = '72px monospace';
  ctx.fillText('SmokeBills', W/2, 120);
  ctx.shadowBlur = 0;

  ctx.font = '22px monospace';
  ctx.fillText('PRESS SPACE TO START', W/2, H - 140);
  ctx.font = '18px monospace';
  ctx.fillStyle = '#ffe27a';
  ctx.fillText('PRESS R OR TAB FOR HALL OF FAME', W/2, H - 104);
  ctx.fillStyle = '#cdeccf';
  ctx.font = '16px monospace';
  ctx.fillText('BEST: ' + formatMoney(best), W/2, H - 72);
  ctx.fillText('ARROWS/WASD MOVE   SPACE SHOOT   P PAUSE   S SOUND', W/2, H - 42);
  drawSoundToast();
}

function drawGameOverOverlay(){
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff6666';
  ctx.font = '72px monospace';
  ctx.fillText('GAME OVER', W/2, H/2 - 90);
  ctx.fillStyle = '#ffd24d';
  ctx.font = '34px monospace';
  ctx.fillText(formatMoney(score), W/2, H/2 - 35);
  ctx.fillStyle = '#d7ffd7';
  ctx.font = '20px monospace';
  ctx.fillText('WAVE ' + wave, W/2, H/2 + 5);

  if(gameOverQualifies){
    ctx.fillStyle = '#ffe27a';
    ctx.fillText('NEW HIGH SCORE INCOMING...', W/2, H/2 + 65);
  } else {
    ctx.fillStyle = '#ffb36b';
    ctx.fillText('NO ENTRASTE AL RANKING', W/2, H/2 + 55);
    ctx.fillStyle = '#cdeccf';
    ctx.font = '16px monospace';
    ctx.fillText('TOP 3', W/2, H/2 + 100);
    for(let i=0;i<3;i++){
      const entry = highScores[i];
      const line = entry ? (String(i+1).padStart(2,' ') + '  ' + entry.name + '  ' + formatMoney(entry.score) + '  WAVE ' + entry.wave) : (String(i+1).padStart(2,' ') + '  ---     ' + formatMoney(0) + '  ---');
      ctx.fillText(line, W/2, H/2 + 128 + i*22);
    }
    ctx.fillText('PRESS SPACE TO BACK', W/2, H/2 + 216);
  }
}

function drawRetroPanel(x,y,w,h){
  ctx.fillStyle = 'rgba(2,10,5,0.86)';
  roundRect(ctx, x, y, w, h, 16);
  ctx.fill();
  ctx.strokeStyle = '#86d989';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,210,77,0.65)';
  ctx.lineWidth = 1;
  roundRect(ctx, x+8, y+8, w-16, h-16, 12);
  ctx.stroke();
}

function drawNameEntryScreen(){
  drawBackgroundBase();
  drawScrollingBills();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);

  const panelW = Math.min(620, W - 40);
  const panelH = Math.min(520, H - 40);
  const x = W/2 - panelW/2;
  const y = H/2 - panelH/2;
  drawRetroPanel(x,y,panelW,panelH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe27a';
  ctx.font = 'bold 34px monospace';
  ctx.fillText('NEW HIGH SCORE', W/2, y + 64);
  ctx.fillStyle = '#d7ffd7';
  ctx.font = '28px monospace';
  ctx.fillText(formatMoney(pendingFinalScore ? pendingFinalScore.score : score), W/2, y + 112);
  ctx.font = '18px monospace';
  ctx.fillText('INGRESA TU NOMBRE', W/2, y + 164);

  const slotSize = 60;
  const gap = 14;
  const startX = W/2 - (LETTER_SLOTS*slotSize + (LETTER_SLOTS-1)*gap)/2;
  const topY = y + 210;
  const blink = Math.floor(performance.now()/250) % 2 === 0;

  for(let i=0;i<LETTER_SLOTS;i++){
    const sx = startX + i*(slotSize + gap);
    drawNameSlot(sx, topY, slotSize, slotSize, nameEntry.letters[i], nameEntry.active === i && blink);
  }
  for(let i=0;i<DIGIT_SLOTS;i++){
    const sx = startX + i*(slotSize + gap);
    drawNameSlot(sx, topY + 86, slotSize, slotSize, nameEntry.digits[i], nameEntry.active === LETTER_SLOTS + i && blink);
  }

  const preview = currentEntryName();
  ctx.fillStyle = '#9ff29f';
  ctx.font = '24px monospace';
  ctx.fillText(preview, W/2, topY + 186);

  const confirmW = 180;
  const confirmH = 46;
  const confirmX = W/2 - confirmW/2;
  const confirmY = topY + 224;
  ctx.fillStyle = nameEntry.active === NAME_SLOT_COUNT && blink ? 'rgba(255,215,84,0.26)' : 'rgba(20,40,20,0.9)';
  roundRect(ctx, confirmX, confirmY, confirmW, confirmH, 10);
  ctx.fill();
  ctx.strokeStyle = nameEntry.active === NAME_SLOT_COUNT ? '#ffd24d' : '#86d989';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffe27a';
  ctx.font = '20px monospace';
  ctx.fillText('CONFIRM', W/2, confirmY + 29);

  ctx.fillStyle = '#d7ffd7';
  ctx.font = '16px monospace';
  ctx.fillText('UP/DOWN CAMBIAR   LEFT/RIGHT MOVER', W/2, y + panelH - 70);
  ctx.fillText('SPACE O ENTER CONFIRMAR', W/2, y + panelH - 42);
  drawSoundToast();
}

function drawNameSlot(x,y,w,h,value,active){
  ctx.fillStyle = active ? 'rgba(255,215,84,0.22)' : 'rgba(8,20,10,0.85)';
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = active ? '#ffd24d' : '#86d989';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = active ? '#fff4c7' : '#d7ffd7';
  ctx.font = 'bold 30px monospace';
  ctx.fillText(value, x + w/2, y + h/2 + 11);
}

function drawRankingScreen(){
  drawBackgroundBase();
  drawScrollingBills();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);

  const panelW = Math.min(820, W - 40);
  const panelH = Math.min(620, H - 40);
  const x = W/2 - panelW/2;
  const y = H/2 - panelH/2;
  drawRetroPanel(x,y,panelW,panelH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe27a';
  ctx.font = 'bold 34px monospace';
  ctx.fillText('SmokeBills', W/2, y + 58);
  ctx.fillStyle = '#cdeccf';
  ctx.font = '22px monospace';
  ctx.fillText('HALL OF FAME', W/2, y + 92);

  const left = x + 42;
  const top = y + 140;
  const rowH = 34;
  const colRank = left + 12;
  const colName = left + 88;
  const colScore = left + 236;
  const colWave = left + 520;

  ctx.strokeStyle = 'rgba(134,217,137,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left, top - 28);
  ctx.lineTo(x + panelW - 42, top - 28);
  ctx.moveTo(left, top + rowH*10 + 8);
  ctx.lineTo(x + panelW - 42, top + rowH*10 + 8);
  ctx.stroke();

  ctx.fillStyle = '#d7ffd7';
  ctx.textAlign = 'left';
  ctx.font = '18px monospace';
  ctx.fillText('#', colRank, top - 8);
  ctx.fillText('NAME', colName, top - 8);
  ctx.fillText('SCORE', colScore, top - 8);
  ctx.fillText('WAVE', colWave, top - 8);

  const rows = [];
  for(let i=0;i<10;i++) rows.push(highScores[i] || null);
  const elapsed = performance.now() - rankingOpenedAt;

  for(let i=0;i<rows.length;i++){
    const entry = rows[i];
    const delay = i * 90;
    const progress = clamp((elapsed - delay) / 350, 0, 1);
    const offsetX = (1 - progress) * 120;
    const yy = top + i*rowH;
    const isNew = entry && entry.id === currentSessionEntryId;
    const color = i === 0 ? '#ffd24d' : i === 1 ? '#d6dde5' : i === 2 ? '#c9894a' : (isNew ? '#98ff98' : '#d7ffd7');
    const icon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : ' ';
    const name = entry ? entry.name : '---';
    const scoreText = entry ? formatMoney(entry.score) : formatMoney(0);
    const waveText = entry ? ('WAVE ' + entry.wave) : '---';

    ctx.save();
    ctx.globalAlpha = progress;
    ctx.translate(offsetX, 0);
    if(isNew){
      ctx.fillStyle = 'rgba(30,120,30,0.22)';
      roundRect(ctx, left - 16, yy - 22, panelW - 100, 28, 8);
      ctx.fill();
    }
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.font = '18px monospace';
    ctx.fillText(String(i+1).padStart(2,' '), colRank, yy);
    ctx.fillText(icon, colRank + 28, yy);
    ctx.fillText(name, colName, yy);
    ctx.fillText(scoreText, colScore, yy);
    ctx.fillText(waveText, colWave, yy);
    if(isNew){
      ctx.fillStyle = '#98ff98';
      ctx.fillText('◄ NEW', colWave + 150, yy);
    }
    ctx.restore();
  }

  const footerText = rankingAutoBackAt ? 'PRESS SPACE OR WAIT TO BACK' : 'PRESS SPACE TO BACK';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe27a';
  ctx.font = '18px monospace';
  ctx.fillText(footerText, W/2, y + panelH - 34);

  drawScanlines();
  drawSoundToast();
}

function drawScanlines(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(let y=0;y<H;y+=4){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  if(state === 'title'){ drawTitleScreen(); return; }
  if(state === 'nameentry'){ drawNameEntryScreen(); return; }
  if(state === 'ranking'){ drawRankingScreen(); return; }

  drawGameplayScene();

  if(pause && state === 'playing'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
  }

  if(state === 'gameover') drawGameOverOverlay();
}

function randomSerial(seed){ return Math.abs(Math.floor(Math.sin(seed || Math.random()) * 1e8)).toString(36).toUpperCase().substr(0,6); }

let last = performance.now();
function frame(){
  const now = performance.now();
  const dt = Math.min(2, (now - last) / 16);
  last = now;
  updateMeta(dt);
  if(state === 'playing' && !pause) updateGame(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
const bg = new Audio('Sonidos/Reina del Pixel.mp3');
bg.loop = true;
bg.volume = 0.18;
bg.preload = 'auto';
try{ bg.load(); }catch(e){}
let musicMuted = false;

let _audioUnlocked = false;
function unlockAudioOnce(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  try{
    bg.muted = true;
    const p = bg.play();
    if(p && p.then){
      p.then(()=>{ bg.pause(); bg.currentTime = 0; bg.muted = false; }).catch(()=>{ bg.muted = false; });
    } else {
      bg.pause();
      bg.currentTime = 0;
      bg.muted = false;
    }
  }catch(e){ try{ bg.muted = false; }catch(_){} }
  try{
    if(window.AudioContext || window.webkitAudioContext){
      const C = window.AudioContext || window.webkitAudioContext;
      const actx = new C();
      if(actx.state === 'suspended') actx.resume().catch(()=>{});
    }
  }catch(e){}
  window.removeEventListener('keydown', unlockAudioOnce);
  window.removeEventListener('mousedown', unlockAudioOnce);
  window.removeEventListener('touchstart', unlockAudioOnce);
}
window.addEventListener('keydown', unlockAudioOnce, {passive:true});
window.addEventListener('mousedown', unlockAudioOnce, {passive:true});
window.addEventListener('touchstart', unlockAudioOnce, {passive:true});

function playBackgroundMusic(){
  try{ unlockAudioOnce(); }catch(e){}
  bg.muted = musicMuted;
  try{
    const p = bg.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

function toggleMusicMute(){
  musicMuted = !musicMuted;
  bg.muted = musicMuted;
  soundToastText = musicMuted ? 'Sound OFF' : 'Sound ON';
  soundToastTimer = 180;
  if(!musicMuted && state === 'playing') playBackgroundMusic();
}

function setLevelMusic(_level){
  try{ bg.currentTime = 0; }catch(e){}
  playBackgroundMusic();
}
</script>
